name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release 版本号标签 (例如: v1.0.0)"
        required: true
        default: "v1.0.0"
      release_title:
        description: "Release 标题"
        required: false
        default: "身份证OCR 商业标准版"
      release_notes:
        description: "更新说明 (Markdown 格式)"
        required: false
        default: |
          ### 🚀 身份证OCR 客户端发布
          - 📷 支持单张/正反合图高精度秒级识别与精准切片
          - 📁 支持多图片批量导入并按人名智能配对
          - 🖨️ A4 扫描件高保真生成（彩色/黑白）与防盗用水印
          - 🔒 纯本地离线推理，数据安全无泄露风险

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 安装项目依赖与打包工具
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      - name: 执行 PyInstaller 单文件编译封装
        shell: pwsh
        run: |
          Write-Host "开始执行 PyInstaller 封装..." -ForegroundColor Cyan
          python -m PyInstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name "身份证OCR" `
            --icon "assets\icon.ico" `
            --add-data "assets;assets" `
            --hidden-import "cryptography" `
            --hidden-import "openpyxl" `
            --hidden-import "docxtpl" `
            --hidden-import "customtkinter" `
            --hidden-import "cv2" `
            --hidden-import "pymupdf" `
            --hidden-import "fitz" `
            --collect-all "customtkinter" `
            --collect-all "rapidocr_onnxruntime" `
            app_gui.py

      - name: 生成买家使用指南并打包发布包
        shell: pwsh
        run: |
          $GuideContent = @"
          ==================================================
            🪪 身份证OCR · 商业标准版 使用与激活指南
          ==================================================

          【首次使用说明】
          1. 双击运行当前目录下的【身份证OCR.exe】（无需配置任何环境，纯绿色软件）。
          2. 打开软件后，点击软件顶部或弹窗中的【一键复制机器码】。
          3. 将机器码发送给客服/卖家，核验后将为您发放 16 位专属激活卡密。
          4. 在软件输入框中粘贴卡密，点击【立即联网验证激活】，即可永久解锁核心功能！

          【功能亮点】
          - 📷 单张正/反面高精度毫秒级提取（支持单图正反合图自动拆分）
          - 📁 批量图片拖拽，自动按人名分组配对识别
          - 🖨️ A4 标准扫描件生成、国标圆角免冠头像切片及防盗水印
          - 📝 自定义 Word / Excel 模板智能套打导出
          - 🔒 纯离线隐私保护，图片绝不上送第三方，政企事业单位合规无忧
          "@
          
          $GuidePath = ".\dist\使用与激活指南.txt"
          [System.IO.File]::WriteAllText($GuidePath, $GuideContent, [System.Text.Encoding]::UTF8)

          $tag = "${{ github.event.inputs.tag_name }}"
          $zipName = "IDCard_OCR_${tag}_Windows_x64.zip"

          # 将 dist 目录打包为便携绿色 ZIP
          Compress-Archive -Path ".\dist\*" -DestinationPath ".\$zipName" -Force
          Write-Host "便携包打包完成: $zipName" -ForegroundColor Green

      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: "${{ github.event.inputs.release_title }} (${{ github.event.inputs.tag_name }})"
          body: ${{ github.event.inputs.release_notes }}
          files: |
            IDCard_OCR_${{ github.event.inputs.tag_name }}_Windows_x64.zip
            dist/身份证OCR.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
