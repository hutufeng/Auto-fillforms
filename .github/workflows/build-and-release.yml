name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release 版本号标签 (例如: v1.0.0)"
        required: true
        default: "v1.0.0"
      release_title:
        description: "Release 标题"
        required: false
        default: "身份证OCR 商业标准版"
      release_notes:
        description: "更新说明 (Markdown 格式)"
        required: false
        default: |
          ### 🚀 身份证OCR 客户端发布
          - 📷 支持单张/正反合图高精度秒级识别与精准切片
          - 📁 支持多图片批量导入并按人名智能配对
          - 🖨️ A4 扫描件高保真生成（彩色/黑白）与防盗用水印
          - 🔒 纯本地离线推理，数据安全无泄露风险

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 安装项目依赖与打包工具
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      - name: 执行 PyInstaller 单文件编译封装
        shell: pwsh
        run: |
          Write-Host "开始执行 PyInstaller 封装..." -ForegroundColor Cyan
          python -m PyInstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name "身份证OCR" `
            --icon "assets\icon.ico" `
            --add-data "assets;assets" `
            --hidden-import "cryptography" `
            --hidden-import "openpyxl" `
            --hidden-import "docxtpl" `
            --hidden-import "customtkinter" `
            --hidden-import "cv2" `
            --hidden-import "pymupdf" `
            --hidden-import "fitz" `
            --collect-all "customtkinter" `
            --collect-all "rapidocr_onnxruntime" `
            app_gui.py

      - name: 生成买家使用指南并打包发布包
        shell: pwsh
        run: |
          $GuideContent = @"
          ======================================================================
               🪪 身份证智能识别与 A4 扫描件管理系统 · 使用与激活指南
          ======================================================================

          感谢您购买本软件！本软件为纯绿色免安装单文件版，无需安装 Python 或任何复杂环境，
          解压后双击即可运行。数据完全在您本地离线处理，100% 保护隐私安全。

          ----------------------------------------------------------------------
          一、首次使用与激活步骤（仅需 1 分钟）
          ----------------------------------------------------------------------
          1. 双击运行当前目录下的【身份证OCR.exe】。
          2. 首次启动软件会自动弹出授权窗口，点击【一键复制机器码】。
          3. 将机器码发送给闲鱼卖家，卖家核验后将为您发放 16 位专属激活卡密。
          4. 将卡密粘贴到软件输入框中，点击【立即联网验证激活】，即可永久解锁核心功能！

          ----------------------------------------------------------------------
          二、主要核心功能使用指引
          ----------------------------------------------------------------------
          1. 单张与一图双面识别：
             - 支持分别选择正反两面，或直接上传一张包含正反两面的合图照片；
             - 点击【完整识别】：自动纠偏倾斜、切取二代证国标圆角卡片；
             - 点击【复制头像】：秒级提取二代证免冠照片，直接 Ctrl+V 粘贴使用；
             - 点击【导出此人 A4 扫描件】：可选择彩色高清或黑白复印质感，并支持自定义防盗防挪用水印。

          2. 批量处理与全员汇总：
             - 切换到【批量表格生成】标签，导入文件夹；
             - 支持按住 Ctrl/Shift 鼠标多选图片，随时一键移除误选文件；
             - 点击【开始批量识别】，完成后一键导出汇总 Excel 台账或批量生成全员 A4 扫描件。

          3. Word / Excel 模板智能套打：
             - 在模板中使用 {{姓名}}、{{身份证号码}}、{{avatar}} (自动插入头像) 等占位符，一键批量填充生成独立文档。

          祝您使用愉快！如有疑问请随时联系闲鱼卖家。
          ======================================================================
          "@
          
          $GuidePath = ".\dist\使用与激活指南.txt"
          [System.IO.File]::WriteAllText($GuidePath, $GuideContent, [System.Text.Encoding]::UTF8)

          $tag = "${{ github.event.inputs.tag_name }}"
          $zipName = "IDCard_OCR_${tag}_Windows_x64.zip"

          # 将 dist 目录打包为便携绿色 ZIP
          Compress-Archive -Path ".\dist\*" -DestinationPath ".\$zipName" -Force
          Write-Host "便携包打包完成: $zipName" -ForegroundColor Green

      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: "${{ github.event.inputs.release_title }} (${{ github.event.inputs.tag_name }})"
          body: ${{ github.event.inputs.release_notes }}
          files: |
            IDCard_OCR_${{ github.event.inputs.tag_name }}_Windows_x64.zip
            dist/身份证OCR.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
