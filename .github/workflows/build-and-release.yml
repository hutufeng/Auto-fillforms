name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release 版本号标签 (例如: v1.0.0)"
        required: true
        default: "v1.0.0"
      release_title:
        description: "Release 标题"
        required: false
        default: "身份证智能录入与扫描助手"
      release_notes:
        description: "更新说明 (Markdown 格式)"
        required: false
        default: |
          ### 🚀 身份证智能录入与扫描助手 发布
          - 📷 支持单张/正反合图高精度秒级识别与精准切片
          - 📁 支持多图片批量导入并按人名智能配对
          - 🖨️ A4 扫描件高保真生成（彩色/黑白）与防盗用水印
          - 🔒 纯本地离线推理，数据安全无泄露风险

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 安装项目依赖与打包工具
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      - name: 执行 PyInstaller 绿色免安装版编译封装 (秒级极速冷启动)
        shell: pwsh
        run: |
          Write-Host "开始执行 PyInstaller 绿色免安装版封装..." -ForegroundColor Cyan
          python -m PyInstaller `
            --noconfirm `
            --onedir `
            --windowed `
            --name "身份证智能录入与扫描助手" `
            --icon "assets\icon.ico" `
            --add-data "assets;assets" `
            --hidden-import "cryptography" `
            --hidden-import "openpyxl" `
            --hidden-import "docxtpl" `
            --hidden-import "customtkinter" `
            --hidden-import "cv2" `
            --hidden-import "pymupdf" `
            --hidden-import "fitz" `
            --collect-all "customtkinter" `
            --collect-all "rapidocr_onnxruntime" `
            app_gui.py

      - name: 生成配套使用指南并归档为便携 ZIP
        shell: pwsh
        run: |
          $AppDir = ".\dist\身份证智能录入与扫描助手"

          $GuideContent = @"
          ======================================================================
                        身份证智能录入与扫描助手 · 使用指南
          ======================================================================

          【软件概述】
          本软件为纯绿色免安装版，无需配置 Python 环境，解压即用。
          所有图像处理与 OCR 识别均在本地离线完成，无网络数据外发。

          ----------------------------------------------------------------------
          一、首次运行与授权激活
          ----------------------------------------------------------------------
          1. 双击运行当前目录下的【身份证智能录入与扫描助手.exe】。
          2. 首次启动将弹出激活窗口，点击【一键复制机器码】。
          3. 将机器码发送给授权管理员，获取 16 位激活卡密。
          4. 粘贴卡密并点击【立即联网验证激活】（仅激活时需连接网络验证 1 秒）。
          5. 激活完成后即可完全离线使用。

          ----------------------------------------------------------------------
          二、主要核心功能使用指引
          ----------------------------------------------------------------------
          1. 单张与一图双面识别：
             - 支持分别选择正反两面，或直接上传一张包含正反两面的合图照片；
             - 点击【完整识别】：自动纠偏倾斜、切取二代证国标圆角卡片；
             - 点击【复制头像】：秒级提取二代证免冠照片，直接 Ctrl+V 粘贴使用；
             - 点击【导出此人 A4 扫描件】：可选择彩色高清或黑白复印质感，并支持自定义防盗防挪用水印。

          2. 批量处理与全员汇总：
             - 切换到【批量表格生成】标签，导入文件夹；
             - 支持按住 Ctrl/Shift 鼠标多选图片，随时一键移除误选文件；
             - 点击【开始批量识别】，完成后一键导出汇总 Excel 台账或批量生成全员 A4 扫描件。

          3. Word / Excel 模板智能套打：
             - 在模板中使用 {{姓名}}、{{身份证号码}}、{{avatar}} (自动插入头像) 等占位符，一键批量填充生成独立文档。

          ----------------------------------------------------------------------
          三、注意事项
          ----------------------------------------------------------------------
          1. 照片建议平放清晰拍摄，避免反光或强烈阴影遮挡关键文字。
          2. 如需更换电脑运行，请使用软件内置的【换机解绑】功能。
          ======================================================================
          "@
          
          $GuidePath = "$AppDir\使用指南.txt"
          [System.IO.File]::WriteAllText($GuidePath, $GuideContent, [System.Text.Encoding]::UTF8)

          $tag = "${{ github.event.inputs.tag_name }}"
          $zipName = "IDCard_Assistant_${tag}_Windows_x64_Portable.zip"

          # 将整个绿色免安装文件夹打包为便携 ZIP
          Compress-Archive -Path $AppDir -DestinationPath ".\$zipName" -Force
          Write-Host "绿色便携包打包完成: $zipName" -ForegroundColor Green

      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: "${{ github.event.inputs.release_title }} (${{ github.event.inputs.tag_name }})"
          body: ${{ github.event.inputs.release_notes }}
          files: |
            IDCard_Assistant_${{ github.event.inputs.tag_name }}_Windows_x64_Portable.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
